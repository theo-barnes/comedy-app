name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pr-description:
    name: Pull request description
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Require completed delivery description
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request?.body ?? '';
            const requiredHeadings = ['Summary', 'Engineering Decisions', 'Validation', 'Delivery'];
            const requiredFields = [
              'Risk',
              'Affected layers and contracts',
              'Reuse or abstraction decision',
              'ADR or execution plan',
              'Commands run and results',
              'User-journey evidence',
              'Documentation impact',
              'Rollout and rollback',
              'Remaining risks or follow-up',
            ];
            const missingHeadings = requiredHeadings.filter((heading) => !body.includes(`## ${heading}`));
            const missingFields = requiredFields.filter((field) => {
              const match = body.match(new RegExp(`^- ${field}:\\s*(.+)$`, 'm'));
              return !match || !match[1].replace(/<!--.*?-->/g, '').trim();
            });
            const summary = body.split('## Engineering Decisions')[0]?.replace('## Summary', '').replace(/<!--[\s\S]*?-->/g, '').trim();

            if (!summary || missingHeadings.length > 0 || missingFields.length > 0) {
              core.setFailed(
                `Complete the pull request template. Missing headings: ${missingHeadings.join(', ') || 'none'}; missing fields: ${missingFields.join(', ') || 'none'}.`,
              );
            }

  test:
    name: Typecheck, lint & test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm quality

      - name: Validate agent governance
        run: pnpm validate:governance

  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        working-directory: backend
        run: pip install -e '.[dev]'

      - name: Test
        working-directory: backend
        # Empty DB URL forces the fake repositories; no database needed.
        run: DISCOVERY_DATABASE_URL='' python -m pytest tests/ -q

  backend-migrations:
    name: Backend migration contract
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: platform
          POSTGRES_DB: platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        working-directory: backend
        run: pip install -e '.[dev]'

      - name: Apply all backend migrations
        working-directory: backend
        env:
          DISCOVERY_DATABASE_URL: postgresql://platform:platform@localhost:5432/platform
        run: |
          alembic upgrade head
          alembic current

      - name: Execute event ORM projection against migrated schema
        working-directory: backend
        env:
          DISCOVERY_DATABASE_URL: postgresql://platform:platform@localhost:5432/platform
        run: |
          python - <<'PY'
          from sqlalchemy import select
          from events.models.orm import EventRow
          from shared.database import get_sessionmaker

          with get_sessionmaker()() as session:
              session.execute(select(EventRow).limit(1))
          print("event_orm_projection_ok")
          PY
