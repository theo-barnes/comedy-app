[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geospatial-discovery-service"
version = "0.2.0"
description = "Location domain: production-grade geospatial place-hierarchy discovery"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2,<3",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "geoalchemy2>=0.15,<1",
  "psycopg[binary,pool]>=3.2,<4",
  "redis>=5.0,<6",
  "h3>=4.0,<5",
  "requests>=2.32,<3",
  "shapely>=2.0,<3",
  "pyjwt[crypto]>=2.8,<3",
  "structlog>=24,<26",
  "sentry-sdk>=2,<3",
  "apscheduler>=3.10,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1"]

[project.scripts]
discovery-ingest = "location.ingest:main"
platform-worker = "workers.main:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["location*", "shared*", "creators*", "social*", "content*", "media*", "events*", "engagement*", "feed*", "analytics*", "workers*"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
pythonpath = ["src", "."]